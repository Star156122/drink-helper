<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f4ec"><title>慢慢喝｜飲料客製化小幫手</title>
<style>
:root{--ink:#20342d;--muted:#738078;--green:#355c49;--lime:#d8e7ae;--paper:#f7f4ec;--white:#fffefa;--line:#e8e4d9;--orange:#ed9b57}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"Noto Sans TC","Microsoft JhengHei",sans-serif}button,select{font:inherit}button{cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:0 26px}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0}.brand{font-weight:900;letter-spacing:.08em;font-size:20px}.brand span{display:inline-grid;place-items:center;width:35px;height:35px;margin-right:8px;border-radius:13px;background:var(--lime);font-size:19px}.topnote{font-size:13px;color:var(--muted)}.hero{display:grid;grid-template-columns:1.03fr .97fr;gap:28px;align-items:center;padding:28px 0 35px}.eyebrow{color:#66806e;font-weight:800;letter-spacing:.18em;font-size:12px}.hero h1{font-size:clamp(36px,5vw,58px);line-height:1.12;letter-spacing:-.04em;margin:12px 0}.hero p{color:var(--muted);line-height:1.8;margin:0;max-width:470px}.hero-art{height:240px;border-radius:30px;background:#e6ebd7;display:grid;place-items:center;position:relative;overflow:hidden}.hero-art:before,.hero-art:after{content:"";position:absolute;border-radius:50%;background:#d2dfbd}.hero-art:before{width:210px;height:210px;left:-45px;bottom:-100px}.hero-art:after{width:180px;height:180px;right:-30px;top:-90px}.cup{position:relative;width:130px;height:152px;z-index:1;background:linear-gradient(180deg,#e9c9a6 0 26%,#b8764e 27% 100%);clip-path:polygon(7% 0,93% 0,82% 100%,18% 100%);border-radius:8px;filter:drop-shadow(0 14px 12px #65734c44)}.cup:before{content:"";position:absolute;top:-18px;left:49px;width:7px;height:42px;background:#526b49;transform:rotate(12deg);border-radius:10px}.cup:after{content:"慢慢喝";position:absolute;left:27px;top:73px;color:#fff5df;font-size:15px;font-weight:900;letter-spacing:.1em}.boba{position:absolute;z-index:2;bottom:48px;display:flex;gap:12px}.boba i{display:block;width:13px;height:13px;border-radius:50%;background:#4b3428}.section-title{display:flex;align-items:end;justify-content:space-between;margin:5px 0 15px}.section-title h2{margin:0;font-size:24px}.section-title small{color:var(--muted)}.builder{display:grid;grid-template-columns:1.4fr .85fr;gap:22px;margin-bottom:50px}.panel{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:22px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}.step{font-size:12px;font-weight:800;color:var(--muted);background:#f2f0e8;padding:7px 11px;border-radius:99px}.step b{color:var(--green);margin-right:5px}.field{margin:18px 0}.field-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.field-head strong{font-size:15px}.field-head small{color:var(--muted);font-size:12px}.drinks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.drink{border:1px solid var(--line);background:#fffefa;border-radius:15px;padding:13px 11px;text-align:left;color:var(--ink);transition:.15s}.drink:hover{transform:translateY(-2px)}.drink.active{border:2px solid var(--green);background:#f0f4e8;padding:12px 10px}.drink-icon{font-size:23px;display:block;margin-bottom:8px}.drink strong{display:block;font-size:14px}.drink small{color:var(--muted)}.choice-row{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fffefa;color:#53615a;border-radius:99px;padding:9px 15px;font-size:13px}.chip.active{background:var(--green);border-color:var(--green);color:white}.addons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.addon{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:10px;font-size:13px}.addon input{accent-color:var(--green);width:16px;height:16px}.addon em{margin-left:auto;color:var(--muted);font-style:normal;font-size:12px}.summary{position:sticky;top:15px;height:max-content}.summary h3{margin:0 0 4px;font-size:18px}.summary .hint{margin:0;color:var(--muted);font-size:12px}.ticket{margin:18px 0;padding:15px;border-radius:15px;background:#f5f3eb}.ticket-name{font-size:18px;font-weight:900}.ticket-meta{font-size:13px;color:var(--muted);line-height:1.9;margin-top:6px}.price-line{border-top:1px dashed #d6d0c3;margin-top:14px;padding-top:12px;display:flex;justify-content:space-between;font-size:14px}.total{display:flex;justify-content:space-between;align-items:center;margin:16px 0}.total span{color:var(--muted);font-size:14px}.total strong{font-size:28px}.qty{display:flex;align-items:center;gap:13px}.qty button{border:1px solid var(--line);background:white;width:30px;height:30px;border-radius:10px;color:var(--green);font-weight:900}.primary{width:100%;border:0;background:var(--green);color:white;border-radius:14px;padding:14px;font-weight:900}.primary:hover{background:#284b39}.reset{width:100%;border:0;background:transparent;color:var(--muted);padding:12px;font-size:13px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#20342d;color:white;padding:12px 18px;border-radius:99px;box-shadow:0 8px 26px #20342d33;transition:.25s;font-size:14px;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}footer{text-align:center;color:var(--muted);font-size:12px;padding:0 0 25px}.foot{border-top:1px solid var(--line);padding-top:18px}@media(max-width:760px){.wrap{padding:0 16px}.hero{grid-template-columns:1fr;gap:18px;padding-top:10px}.hero-art{height:185px}.builder{grid-template-columns:1fr}.summary{position:static}.drinks{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{padding:17px}.topnote{max-width:130px;text-align:right}}
</style></head>
<body><div class="wrap"><header class="top"><div class="brand"><span>🍵</span>慢慢喝</div><div class="topnote">把今天的心情，調成喜歡的味道</div></header>
<section class="hero"><div><div class="eyebrow">YOUR DRINK, YOUR WAY</div><h1>今天想喝，<br>一杯什麼？</h1><p>挑一杯喜歡的，再調整甜度、冰量和配料。小幫手會幫你整理成清楚的點單內容。</p></div><div class="hero-art" aria-label="一杯手搖飲插畫"><div class="cup"></div><div class="boba"><i></i><i></i><i></i></div></div></section>
<div class="section-title"><h2>自訂你的飲料</h2><small>每一杯都是照你的喜好調的</small></div>
<main class="builder"><section class="panel"><div class="steps"><span class="step"><b>01</b>選飲料</span><span class="step"><b>02</b>調甜冰</span><span class="step"><b>03</b>加配料</span></div>
<div class="field"><div class="field-head"><strong>選一款飲料</strong><small>點選卡片更換品項</small></div><div class="drinks" id="drinks"></div></div>
<div class="field"><div class="field-head"><strong>甜度</strong><small>依照今天的心情選</small></div><div class="choice-row" id="sugar"></div></div>
<div class="field"><div class="field-head"><strong>冰量</strong><small>熱飲會自動略過冰量</small></div><div class="choice-row" id="ice"></div></div>
<div class="field"><div class="field-head"><strong>加點配料</strong><small>最多選 3 種</small></div><div class="addons" id="addons"></div></div></section>
<aside class="panel summary"><h3>你的點單小卡</h3><p class="hint">確認客製內容，再加入點單</p><div class="ticket"><div class="ticket-name" id="sumName"></div><div class="ticket-meta" id="sumMeta"></div><div class="price-line"><span>單杯小計</span><strong id="unitPrice"></strong></div></div><div class="total"><span>杯數</span><div class="qty"><button id="minus" aria-label="減少杯數">−</button><strong id="qty">1</strong><button id="plus" aria-label="增加杯數">+</button></div></div><div class="total"><span>預估總金額</span><strong id="total"></strong></div><button class="primary" id="addOrder">加入點單</button><button class="reset" id="reset">重新開始</button><div id="orderList" class="ticket" hidden></div></aside></main>
<footer><div class="foot">慢慢喝｜飲料客製化與點餐小幫手　・　價格為課堂作品示範</div></footer></div><div class="toast" id="toast" role="status"></div>
<script>
const menu=[{name:'茉香綠茶',price:35,icon:'🍃',desc:'清爽茶香'},{name:'珍珠奶茶',price:55,icon:'🧋',desc:'經典濃醇'},{name:'百香雙響炮',price:60,icon:'🍋',desc:'酸甜果香'},{name:'黑糖鮮奶',price:65,icon:'🥛',desc:'香濃滑順'},{name:'冬瓜檸檬',price:50,icon:'🍹',desc:'清甜解膩'},{name:'桂花烏龍',price:45,icon:'🌼',desc:'焙茶回甘'}];
const sugars=['無糖','微糖','半糖','少糖','全糖'],ices=['去冰','微冰','少冰','正常冰'],addons=[['珍珠',10],['椰果',10],['仙草',10],['布丁',15],['奶蓋',20],['燕麥奶',15]];
let state={drink:1,sugar:'半糖',ice:'少冰',addons:[],qty:1,orders:[]};
const $=id=>document.getElementById(id);const money=n=>`$${n}`;
function render(){ $('drinks').innerHTML=menu.map((d,i)=>`<button class="drink ${state.drink===i?'active':''}" data-drink="${i}"><span class="drink-icon">${d.icon}</span><strong>${d.name}</strong><small>${d.desc}・${money(d.price)}</small></button>`).join('');
$('sugar').innerHTML=sugars.map(x=>`<button class="chip ${state.sugar===x?'active':''}" data-sugar="${x}">${x}</button>`).join('');
$('ice').innerHTML=ices.map(x=>`<button class="chip ${state.ice===x?'active':''}" data-ice="${x}">${x}</button>`).join('');
$('addons').innerHTML=addons.map(([n,p])=>`<label class="addon"><input type="checkbox" data-addon="${n}" ${state.addons.includes(n)?'checked':''}><span>${n}</span><em>+${p}</em></label>`).join('');
const d=menu[state.drink],extra=state.addons.reduce((s,n)=>s+addons.find(a=>a[0]===n)[1],0),unit=d.price+extra;$('sumName').textContent=`${d.icon} ${d.name}`;$('sumMeta').innerHTML=`${d.name==='黑糖鮮奶'?'甜度：'+state.sugar+'<br>冰量：固定冷飲':'甜度：'+state.sugar+'<br>冰量：'+state.ice}<br>加料：${state.addons.length?state.addons.join('、'):'不加料'}`;$('unitPrice').textContent=money(unit);$('qty').textContent=state.qty;$('total').textContent=money(unit*state.qty);
$('orderList').hidden=!state.orders.length;$('orderList').innerHTML=state.orders.length?`<b>已加入點單（${state.orders.length} 項）</b><br>${state.orders.map(o=>`${o.name} × ${o.qty}　${money(o.total)}`).join('<br>')}<div class="price-line"><span>點單合計</span><strong>${money(state.orders.reduce((s,o)=>s+o.total,0))}</strong></div>`:'';
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-drink]');if(b){state.drink=+b.dataset.drink;render()}const s=e.target.closest('[data-sugar]');if(s){state.sugar=s.dataset.sugar;render()}const i=e.target.closest('[data-ice]');if(i){state.ice=i.dataset.ice;render()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-addon]')){const n=e.target.dataset.addon;if(e.target.checked){if(state.addons.length>=3){e.target.checked=false;showToast('配料最多選 3 種喔');return}state.addons.push(n)}else state.addons=state.addons.filter(x=>x!==n);render()}});
$('minus').onclick=()=>{state.qty=Math.max(1,state.qty-1);render()};$('plus').onclick=()=>{state.qty=Math.min(20,state.qty+1);render()};$('addOrder').onclick=()=>{const d=menu[state.drink],unit=d.price+state.addons.reduce((s,n)=>s+addons.find(a=>a[0]===n)[1],0);state.orders.push({name:d.name,qty:state.qty,total:unit*state.qty});render();showToast('已加入點單！可以繼續客製下一杯')};$('reset').onclick=()=>{state={drink:1,sugar:'半糖',ice:'少冰',addons:[],qty:1,orders:[]};render();showToast('已重新開始')};let timer;function showToast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),2200)}render();
</script></body></html>
